
<!DOCTYPE html>
<html>
<head>
    <title>Create an Avatar</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
        }

        .avatars {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid gray;
            object-fit: cover;
        }

        #selectedAvatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-top: 15px;
            object-fit: cover;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CREATE AN AVATAR</h1>

        <h3>Choose an Avatar</h3>

        <div class="avatars">
            <img src="https://i.pravatar.cc/150?img=12"
                 class="avatar" onclick="selectAvatar(this.src)">

            <img src="https://i.pravatar.cc/150?img=47"
                 class="avatar" onclick="selectAvatar(this.src)">

            <img src="https://i.pravatar.cc/150?img=33"
                 class="avatar" onclick="selectAvatar(this.src)">
        </div>

        <h3>Or Upload Your Own Picture</h3>

        <input type="file" id="fileInput" accept="image/*">

        <h3>Selected Avatar</h3>

        <img id="selectedAvatar" src="" alt="No Avatar Selected">

        <br>

        <button onclick="resetAvatar()">Reset</button>

    </div>

    <script>

        function selectAvatar(src) {
            document.getElementById("selectedAvatar").src = src;
        }

        document.getElementById("fileInput").addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (file && file.type.startsWith("image/")) {
                document.getElementById("selectedAvatar").src =
                    URL.createObjectURL(file);
            }

        });

        function resetAvatar() {
            document.getElementById("selectedAvatar").src = "";
            document.getElementById("fileInput").value = "";
        }

    </script>

</body>
</html>
